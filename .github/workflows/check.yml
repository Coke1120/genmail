name: Checks and desktop releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.0
      - run: npm run rust:test
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.5'
      - run: npm run check
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file rust/Cargo.lock
      - run: npm run benchmark:mail -- --output=test-results/migration-node.json
      - run: npm run benchmark:mail -- --engine=rust --output=test-results/migration-rust.json
      - run: npm run benchmark:rust-service -- --output=test-results/migration-rust-service.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-benchmark-${{ matrix.os }}
          path: test-results/migration-*.json
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: npm run macos:test
      - if: runner.os == 'macOS'
        run: npm run macos:build
        env:
          MORROW_GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
          MORROW_REQUIRE_GOOGLE_OAUTH: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      - if: runner.os == 'Windows'
        run: npm run windows:build
        env:
          MORROW_GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
          MORROW_REQUIRE_GOOGLE_OAUTH: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      - if: runner.os == 'Windows'
        run: npm run desktop:test -- --packaged
      - if: runner.os == 'macOS' || runner.os == 'Windows'
        run: npm run updater:test
      - if: matrix.artifact && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: node scripts/package-release.js
      - if: matrix.artifact && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morrow-${{ matrix.artifact }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 1
  rust-desktop:
    # Additional signed-upgrade acceptance for the Rust packages published above.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MORROW_SERVICE_RUNTIME: rust
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup default 1.98.0
      - run: npm run build
      - run: cargo test --manifest-path rust/Cargo.toml --locked --lib updater::download_tests
      - run: cargo test --manifest-path rust/Cargo.toml --locked --test updater
      - if: runner.os == 'macOS'
        run: npm run macos:build
        env:
          MORROW_GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
          MORROW_REQUIRE_GOOGLE_OAUTH: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      - if: runner.os == 'macOS'
        run: npm run macos:rust:test
      - if: runner.os == 'Windows'
        run: npm run windows:build
        env:
          MORROW_GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
          MORROW_REQUIRE_GOOGLE_OAUTH: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      - if: runner.os == 'Windows'
        run: npm run desktop:test -- --packaged
      - run: npm run updater:rust-upgrade:test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, rust-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: morrow-*
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/publish-release.js
        env:
          GH_TOKEN: ${{ github.token }}
          MORROW_UPDATE_SIGNING_KEY: ${{ secrets.MORROW_UPDATE_SIGNING_KEY }}
